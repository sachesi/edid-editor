name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    # The compiler and the libraries the application is developed against.
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core just meson ninja-build gcc-c++ gtk4-devel libadwaita-devel
          desktop-file-utils appstream gettext python3
      - uses: actions/checkout@v5
      - name: Lint
        run: just check
      - name: Test
        run: just test

  cli:
    name: Command line without GTK
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core just meson ninja-build gcc-c++ python3 bash-completion zsh fish
      - uses: actions/checkout@v5
      - name: Test
        run: just gui=disabled test

  aur:
    name: AUR
    needs: [check, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/aur.yml
    # A called workflow sees no secrets, its environment's included, unless the
    # caller passes them on.
    secrets: inherit
